
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>临时邮箱</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        :root {
            --bg-color: #f5f7fb; --card-bg: #ffffff; --text-primary: #1e293b;
            --text-secondary: #5b6e8c; --border-color: #e9eef3; --accent-color: #1e3c72;
            --glass-bg: rgba(255, 255, 255, 0.15); --glass-border: rgba(255, 255, 255, 0.2);
            --marquee-bg: rgba(255, 255, 255, 0.15); --result-bg: rgba(30, 60, 114, 0.05);
            --tag-bg: #eef2ff;
        }
        body.dark {
            --bg-color: #0f172a; --card-bg: #1e293b; --text-primary: #f1f5f9;
            --text-secondary: #94a3b8; --border-color: #334155; --accent-color: #60a5fa;
            --glass-bg: rgba(0, 0, 0, 0.3); --glass-border: rgba(255, 255, 255, 0.1);
            --marquee-bg: rgba(0, 0, 0, 0.3); --result-bg: rgba(96, 165, 250, 0.1);
            --tag-bg: #334155;
        }
        body { font-family: system-ui, -apple-system, sans-serif; background: var(--bg-color); color: var(--text-primary); min-height: 100vh; transition: all 0.3s; }
        .marquee-container { position: fixed; top: 0; left: 0; width: 100%; background: var(--marquee-bg); backdrop-filter: blur(12px); padding: 8px 0; z-index: 100; border-bottom: 1px solid var(--glass-border); overflow: hidden; }
        .marquee { white-space: nowrap; display: inline-block; animation: marquee 22s linear infinite; }
        .marquee a { color: var(--text-primary); font-weight: bold; text-decoration: none; padding: 0 30px; font-size: 15px; display: inline-block; background: rgba(255,255,255,0.2); border-radius: 30px; margin: 0 5px; }
        @keyframes marquee { 0% { transform: translateX(0); } 100% { transform: translateX(-100%); } }
        .container { max-width: 800px; margin: 0 auto; padding: 100px 20px 40px; }
        .search-header { background: var(--card-bg); border-radius: 32px; padding: 32px 40px; margin-bottom: 24px; border: 1px solid var(--border-color); text-align: center; }
        .avatar { width: 80px; height: 80px; border-radius: 50%; margin-top: 15px; margin-bottom: 15px; border: 3px solid rgba(255,255,255,0.5); box-shadow: 0 4px 15px rgba(0,0,0,0.2); }
        h1 { font-size: 2.2rem; font-weight: 700; background: linear-gradient(135deg, #4a6cf7, #ff6b6b, #4ecdc4); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .mail-display { background: var(--result-bg); padding: 16px 24px; border-radius: 60px; font-family: monospace; font-size: 1.1rem; font-weight: 600; margin: 20px 0; color: var(--text-primary); border: 1px solid var(--border-color); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
        .btn-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
        .btn { min-width: 120px; padding: 12px 24px; border-radius: 60px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; }
        .btn-p { background: var(--accent-color); color: white; }
        .btn-s { background: var(--tag-bg); color: var(--text-primary); }
        .results-container { background: var(--card-bg); border-radius: 32px; padding: 24px; border: 1px solid var(--border-color); min-height: 300px; }
        .results-title { font-size: 0.9rem; color: var(--text-secondary); margin-bottom: 20px; padding-left: 10px; border-left: 4px solid var(--accent-color); }
        .msg-item { background: var(--result-bg); border-radius: 20px; padding: 20px; margin-bottom: 16px; border: 1px solid var(--border-color); cursor: pointer; transition: 0.2s; }
        .msg-item:hover { border-color: var(--accent-color); transform: translateY(-2px); }
        .modal { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.6); backdrop-filter: blur(10px); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
        .modal-content { background: var(--card-bg); width: 100%; max-width: 650px; height: 85vh; border-radius: 28px; display: flex; flex-direction: column; overflow: hidden; border: 1px solid var(--border-color); }
        .modal-header { padding: 20px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
        .modal-body { flex: 1; overflow-y: auto; padding: 20px; background: #fff; color: #333; }
        .close-btn { background: var(--tag-bg); border: none; padding: 8px 15px; border-radius: 20px; cursor: pointer; font-weight: bold; }
        .music-player { position: fixed; bottom: 25px; right: 25px; z-index: 102; }
        .music-toggle { width: 50px; height: 50px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; }
        .music-toggle.playing { animation: rotate 4s linear infinite; }
        @keyframes rotate { from { transform: rotate(0deg); } to { transform: rotate(360deg); } }
        .theme-toggle { position: fixed; top: 70px; right: 20px; width: 45px; height: 45px; border-radius: 50%; background: var(--card-bg); border: 1px solid var(--border-color); display: flex; align-items: center; justify-content: center; cursor: pointer; z-index: 101; }
        .email-meta { font-size: 0.75rem; color: var(--text-secondary); display: flex; gap: 15px; flex-wrap: wrap; margin-top: 4px; }
        .badge-unread { background: #ef4444; color: white; font-size: 0.6rem; padding: 2px 10px; border-radius: 20px; }
        .badge-read { background: var(--tag-bg); color: var(--text-secondary); font-size: 0.6rem; padding: 2px 10px; border-radius: 20px; }
    </style>
</head>
<body>
    <div class="marquee-container">
        <div class="marquee">
            <a href="" target="_blank">🔥临时邮箱</a>
            <a href="" target="_blank">🔥临时邮箱</a>
        </div>
    </div>

    <div class="theme-toggle" id="themeToggle">🌙</div>

    <div class="container">
        <div class="search-header">
            <h1>裤佬临时邮箱</h1>
            <img src="https://mpimg.cn/view.php/f28da3eac8f392e9fa2ba91723b2bf4c.png" class="avatar">
            <p style="color: var(--text-secondary); font-size: 0.9rem;">📭 隐私保护 · 阅后即焚 · 完全免费</p>
            <div id="addr" class="mail-display">正在连接裤佬服务器...</div>
            <div class="btn-group">
                <button onclick="copyMail()" class="btn btn-s">📋 复制地址</button>
                <button onclick="initMail()" class="btn btn-p">🔄 更换地址</button>
            </div>
        </div>

        <div class="results-container">
            <div class="results-title">📥 实时收件箱 <span id="mailCount" style="font-weight:normal;"></span></div>
            <div id="list">
                <div style="text-align: center; padding: 60px; color: var(--text-secondary);">等待邮件推送中...</div>
            </div>
        </div>
    </div>

    <div id="mailModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <span id="modalSubject" style="font-weight: bold; overflow: hidden; text-overflow: ellipsis; white-space: nowrap;">邮件内容</span>
                <button class="close-btn" onclick="closeMail()">关闭</button>
            </div>
            <div id="modalBody" class="modal-body"></div>
        </div>
    </div>

    <div class="music-player">
        <div class="music-toggle" id="musicToggle">💿</div>
    </div>
    <audio id="bgm" loop src="https://mpimg.cn/view.php/13d63b273afac14ec9989057a4e3f94b.mp3"></audio>

    <script>
        // ===== 使用 DuckMail API =====
        const API_URL = "https://api.duckmail.sbs";
        let currentAccount = { address: "", password: "", token: "", id: "" };
        let pollTimer = null;
        let mailList = [];
        let isFirstFetch = true;

        // 主题切换
        document.getElementById('themeToggle').onclick = function() {
            document.body.classList.toggle('dark');
            this.textContent = document.body.classList.contains('dark') ? '☀️' : '🌙';
        };

        // 背景音乐
        const music = document.getElementById('bgm');
        const mBtn = document.getElementById('musicToggle');
        mBtn.onclick = () => {
            if(music.paused) { music.play(); mBtn.classList.add('playing'); }
            else { music.pause(); mBtn.classList.remove('playing'); }
        };

        // 获取可用域名（系统域名）
        async function getAvailableDomain() {
            try {
                const res = await fetch(`${API_URL}/domains`);
                const data = await res.json();
                const members = data['hydra:member'] || [];
                // 优先使用系统域名（ownerId 为 null）
                const sysDomain = members.find(d => d.ownerId === null && d.isVerified === true);
                if (sysDomain) return sysDomain.domain;
                if (members.length > 0) return members[0].domain;
                return "duckmail.sbs"; // fallback
            } catch(e) {
                console.warn("获取域名失败，使用默认:", e);
                return "duckmail.sbs";
            }
        }

        async function initMail() {
            const addrEl = document.getElementById('addr');
            addrEl.innerText = "⚡ 正在分配加密信箱...";
            if(pollTimer) clearInterval(pollTimer);
            document.getElementById('list').innerHTML = '<div style="text-align: center; padding: 60px; color: var(--text-secondary);">⏳ 正在创建邮箱...</div>';
            document.getElementById('mailCount').textContent = '';

            try {
                // 1. 获取可用域名
                const domain = await getAvailableDomain();

                // 2. 生成随机账号
                const user = Math.random().toString(36).substring(2, 12);
                const pass = Math.random().toString(36).substring(2, 12) + "A1!";
                currentAccount.address = `${user}@${domain}`;
                currentAccount.password = pass;

                // 3. 创建账号 (expiresIn: 0 表示永不过期)
                const createRes = await fetch(`${API_URL}/accounts`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        address: currentAccount.address,
                        password: currentAccount.password,
                        expiresIn: 0   // 永久有效
                    })
                });

                if (!createRes.ok) {
                    const err = await createRes.json();
                    throw new Error(err.message || "创建账号失败");
                }
                const accountData = await createRes.json();
                currentAccount.id = accountData.id;

                // 4. 获取 Token
                const tokenRes = await fetch(`${API_URL}/token`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        address: currentAccount.address,
                        password: currentAccount.password
                    })
                });

                if (!tokenRes.ok) {
                    const err = await tokenRes.json();
                    throw new Error(err.message || "获取Token失败");
                }
                const tokenData = await tokenRes.json();
                currentAccount.token = tokenData.token;

                addrEl.innerText = currentAccount.address;
                document.getElementById('list').innerHTML = '<div style="text-align: center; padding: 60px; color: var(--text-secondary);">🚀 信箱已就绪，等待收信...</div>';
                isFirstFetch = true;

                // 5. 立即拉取一次
                await fetchMessages();

                // 6. 启动轮询 (每 5 秒)
                pollTimer = setInterval(fetchMessages, 5000);

            } catch(e) {
                console.error("初始化失败:", e);
                addrEl.innerText = "❌ 连接失败: " + e.message;
                document.getElementById('list').innerHTML = `<div style="text-align: center; padding: 60px; color: #ef4444;">⚠️ ${e.message}<br><button onclick="initMail()" style="margin-top:15px;padding:10px 30px;border-radius:30px;border:none;background:var(--accent-color);color:white;cursor:pointer;">重试</button></div>`;
            }
        }

        async function fetchMessages() {
            if (!currentAccount.token) return;

            try {
                const res = await fetch(`${API_URL}/messages`, {
                    headers: {
                        'Authorization': `Bearer ${currentAccount.token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (res.status === 401) {
                    // Token 过期，重新初始化
                    console.warn("Token 过期，重新初始化...");
                    initMail();
                    return;
                }

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || `HTTP ${res.status}`);
                }

                const data = await res.json();
                const msgs = data['hydra:member'] || [];
                const total = data['hydra:totalItems'] || 0;

                // 更新计数
                const unreadCount = msgs.filter(m => !m.seen).length;
                document.getElementById('mailCount').textContent = `(${total} 封${unreadCount > 0 ? `, ${unreadCount} 未读` : ''})`;

                if (msgs.length > 0) {
                    mailList = msgs;
                    document.getElementById('list').innerHTML = msgs.map((m) => `
                        <div class="msg-item" onclick="readMail('${m.id}')">
                            <div style="display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:4px;">
                                <span style="font-size:0.8rem; color:var(--accent-color); font-weight:bold;">📩 ${m.from.name || m.from.address}</span>
                                <span class="${m.seen ? 'badge-read' : 'badge-unread'}">${m.seen ? '已读' : '未读'}</span>
                            </div>
                            <div style="font-weight:700; margin:5px 0;">${m.subject || '(无主题)'}</div>
                            <div class="email-meta">
                                <span>📎 ${m.hasAttachments ? '有附件' : '无附件'}</span>
                                <span>📏 ${(m.size / 1024).toFixed(1)} KB</span>
                                <span>🕐 ${new Date(m.createdAt).toLocaleString('zh-CN')}</span>
                            </div>
                        </div>
                    `).join('');

                    // 如果是首次拉取且有邮件，播放提示音（可选）
                    if (isFirstFetch && msgs.length > 0) {
                        isFirstFetch = false;
                    }
                } else {
                    if (document.getElementById('list').querySelector('.msg-item') === null) {
                        document.getElementById('list').innerHTML = '<div style="text-align: center; padding: 40px; color: var(--text-secondary);">📭 收件箱空空如也，等待新邮件...</div>';
                    }
                }
            } catch(e) {
                console.warn("拉取邮件失败:", e);
                // 不覆盖已有列表，静默失败
            }
        }

        async function readMail(id) {
            const modal = document.getElementById('mailModal');
            const mBody = document.getElementById('modalBody');
            const subjectEl = document.getElementById('modalSubject');

            mBody.innerHTML = "⏳ 正在加载邮件内容...";
            modal.style.display = 'flex';

            try {
                const res = await fetch(`${API_URL}/messages/${id}`, {
                    headers: {
                        'Authorization': `Bearer ${currentAccount.token}`,
                        'Content-Type': 'application/json'
                    }
                });

                if (res.status === 401) {
                    mBody.innerHTML = "⚠️ 登录已过期，请刷新页面重新获取邮箱";
                    return;
                }

                if (!res.ok) {
                    const err = await res.json().catch(() => ({}));
                    throw new Error(err.message || `HTTP ${res.status}`);
                }

                const data = await res.json();

                // 设置标题
                subjectEl.innerText = data.subject || '(无主题)';

                // 构建邮件内容
                let htmlContent = '';
                if (data.html && data.html.length > 0) {
                    htmlContent = data.html.join('<hr>');
                } else if (data.text) {
                    htmlContent = `<pre style="white-space:pre-wrap;font-family:inherit;font-size:14px;line-height:1.6;">${data.text}</pre>`;
                } else {
                    htmlContent = '(邮件内容为空)';
                }

                // 显示发件人等信息
                const fromInfo = data.from ? `${data.from.name ? data.from.name + ' ' : ''}&lt;${data.from.address}&gt;` : '未知';
                const metaInfo = `
                    <div style="background:#f8fafc;padding:10px 14px;border-radius:12px;margin-bottom:16px;font-size:13px;color:#475569;border:1px solid #e2e8f0;">
                        <div><strong>发件人：</strong>${fromInfo}</div>
                        <div><strong>时间：</strong>${new Date(data.createdAt).toLocaleString('zh-CN')}</div>
                        ${data.hasAttachments ? `<div><strong>附件：</strong>${(data.attachments || []).map(a => `📎 ${a.filename} (${(a.size/1024).toFixed(1)} KB)`).join('； ')}</div>` : ''}
                    </div>
                `;

                mBody.innerHTML = metaInfo + htmlContent;

                // 标记为已读
                try {
                    await fetch(`${API_URL}/messages/${id}`, {
                        method: 'PATCH',
                        headers: {
                            'Authorization': `Bearer ${currentAccount.token}`,
                            'Content-Type': 'application/json'
                        }
                    });
                    // 刷新列表更新状态
                    fetchMessages();
                } catch(e) {
                    // 忽略标记已读失败
                }

            } catch(e) {
                mBody.innerHTML = `❌ 加载失败: ${e.message}`;
            }
        }

        function closeMail() {
            document.getElementById('mailModal').style.display = 'none';
        }

        function copyMail() {
            if (!currentAccount.address) return;
            navigator.clipboard.writeText(currentAccount.address).then(() => {
                const addrEl = document.getElementById('addr');
                const original = addrEl.innerText;
                addrEl.innerText = '✅ 已复制!';
                setTimeout(() => { addrEl.innerText = original; }, 1500);
            }).catch(() => {
                // fallback
                const textArea = document.createElement('textarea');
                textArea.value = currentAccount.address;
                document.body.appendChild(textArea);
                textArea.select();
                document.execCommand('copy');
                document.body.removeChild(textArea);
                alert('已复制：' + currentAccount.address);
            });
        }

        // 点击 modal 外部关闭
        document.getElementById('mailModal').addEventListener('click', function(e) {
            if (e.target === this) closeMail();
        });

        // 键盘 ESC 关闭
        document.addEventListener('keydown', function(e) {
            if (e.key === 'Escape') closeMail();
        });

        // 页面加载启动
        window.onload = () => {
            initMail();
            // 点击页面任意位置播放音乐（浏览器策略）
            const playOnce = () => {
                music.play().catch(() => {});
                mBtn.classList.add('playing');
                document.removeEventListener('click', playOnce);
            };
            document.addEventListener('click', playOnce);
        };
    </script>
</body>
</html>
