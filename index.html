        @layer utilities {

            }
            .card-hover {

            .card-hover:hover {
                transform: translateY(-6px);

                border-color: rgba(74, 222, 128, 0.3);
            }
            .meteor {
                position: absolute;
                width: 2px;
                height: 2px;
                background: white;
                border-radius: 50%;
                box-shadow: 0 0 0 1px rgba(255,255,255,0.1);
                animation: meteor linear infinite;
            }
            .meteor::before {
                content: '';
                position: absolute;
                top: 50%;
                transform: translateY(-50%);
                width: 100px;
                height: 1px;
                background: linear-gradient(90deg, #4ade80, transparent);
            }
            @keyframes meteor {
                0% {
                    opacity: 1;
                    transform: translate(0, 0);
                }
                100% {
                    opacity: 0;
                    transform: translate(-300px, 300px);
                }
            }
            @keyframes star-twinkle {

                50% { opacity: 1; }
            }
            @keyframes fadeInUp {
                to {
                    opacity: 1;
                    transform: translateY(0);
                }
            }
            @keyframes fadeIn {
                from { opacity: 0; transform: translateY(10px); }
                to { opacity: 1; transform: translateY(0); }
            }
            .star {
                position: absolute;
                width: 2px;
                height: 2px;
                background: white;
                border-radius: 50%;
                animation: star-twinkle 3s ease-in-out infinite;

        // ===================== 渲染逻辑 =====================
        function createSiteCard(site, index) {
            const card = document.createElement('a');
            card.href = site.url;
            card.target = "_blank";
            card.rel = "noopener noreferrer";
            card.className = "glass-card card-hover group rounded-xl p-4 flex flex-col gap-2 opacity-0 translate-y-4";
            card.style.animation = `fadeInUp 0.5s ease forwards ${index * 0.05}s`;
            
            // 图标容错：加载失败显示首字母
            const iconHtml = `
                <div class="w-12 h-12 rounded-lg ${site.bgColor} flex items-center justify-center overflow-hidden shrink-0">
                    <img src="${site.icon}" alt="${site.name}" class="w-7 h-7 object-contain" onerror="this.style.display='none';this.nextElementSibling.style.display='flex'">
                    <span class="text-xl font-bold text-white w-full h-full items-center justify-center" style="display:none">${site.name.charAt(0)}</span>
                </div>
            `;
            
            card.innerHTML = `
                <div class="flex items-center gap-3">
                    ${iconHtml}
                    <div class="flex-1 min-w-0">
                        <h3 class="text-lg font-bold text-white mb-1 flex items-center justify-between truncate">
                            ${site.name}
                            <i class="fa fa-external-link text-slate-400 text-xs ml-1 opacity-0 group-hover:opacity-100 transition-opacity shrink-0"></i>
                        </h3>
                        <p class="text-slate-400 text-sm leading-snug line-clamp-2">${site.desc}</p>
                    </div>
                </div>
            `;
            
            return card;
        }

        function renderCategories() {

                    // 渲染Tab内容容器

                                ? 'bg-primary/20 text-primary border border-primary/30' 
                                : 'bg-slate-800/50 text-slate-400 border border-transparent hover:text-white hover:bg-slate-700/50'
                        }`;
                        tabBtn.textContent = sub.subtitle;
                        tabBtn.dataset.tabIndex = subIdx;
                        
                        // 点击Tab切换内容
                        tabBtn.addEventListener('click', () => {
                            // 切换按钮状态
                            tabBar.querySelectorAll('button').forEach(btn => {
                                btn.className = 'px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300 bg-slate-800/50 text-slate-400 border border-transparent hover:text-white hover:bg-slate-700/50';
                            });
                            tabBtn.className = 'px-4 py-2 rounded-lg text-sm font-medium transition-all duration-300 bg-primary/20 text-primary border border-primary/30';
                            
                            // 切换网站内容
                            renderTabSites(tabContent, sub.sites);
                        });
                        
                        tabBar.appendChild(tabBtn);

                        // 默认显示第一个分类的内容
                        if (subIdx === 0) {
                            renderTabSites(tabContent, sub.sites);
                        }
                    });

                    catSection.appendChild(tabBar);
                    catSection.appendChild(tabContent);
                
                
                container.appendChild(catSection);
            });
        }

        // 渲染Tab切换时的网站卡片

            });
            
            container.appendChild(sitesGrid);
        }

        // ===================== 星空背景效果 =====================
        function initStars() {
            const canvas = document.getElementById('starCanvas');
            const ctx = canvas.getContext('2d');
            let stars = [];
            
            function resize() {
                canvas.width = window.innerWidth;
                canvas.height = window.innerHeight;
                stars = [];
                for (let i = 0; i < 200; i++) {
                    stars.push({
                        x: Math.random() * canvas.width,
                        y: Math.random() * canvas.height,
                        radius: Math.random() * 1.5,
                        opacity: Math.random(),
                        speed: Math.random() * 0.02
                    });
                }
            }
            
            function draw() {
                ctx.clearRect(0, 0, canvas.width, canvas.height);
                stars.forEach(star => {
                    ctx.beginPath();
                    ctx.arc(star.x, star.y, star.radius, 0, Math.PI * 2);
                    ctx.fillStyle = `rgba(255, 255, 255, ${star.opacity})`;
                    ctx.fill();
                    star.opacity += star.speed;
                    if (star.opacity > 1 || star.opacity < 0.2) star.speed = -star.speed;
                });
                requestAnimationFrame(draw);
            }
            
            resize();
            draw();
            window.addEventListener('resize', resize);
        }

        // ===================== 流星效果 =====================
        function initMeteors() {
            const container = document.getElementById('meteorContainer');
            function createMeteor() {
                const meteor = document.createElement('div');
                meteor.className = 'meteor';
                meteor.style.left = Math.random() * window.innerWidth + 'px';
                meteor.style.top = Math.random() * window.innerHeight * 0.5 + 'px';
                meteor.style.animationDuration = (Math.random() * 2 + 1) + 's';
                container.appendChild(meteor);
                
                setTimeout(() => meteor.remove(), 3000);
            }
            setInterval(createMeteor, 2500);
            // 初始化创建几个
            for (let i = 0; i < 3; i++) setTimeout(createMeteor, i * 800);
        }

        // 添加入场动画

                }
            }
        `;
        document.head.appendChild(style);

        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            renderCategories();
            initStars();
            initMeteors();
        });
