        // 更新计数
        function updateCount() {
            siteCount.textContent = `${websites.length} 个网站`;
        }

        // 百度搜索
        function baiduSearch(keyword) {
            if (keyword.trim()) {
                window.open(`https://www.baidu.com/s?wd=${encodeURIComponent(keyword)}`, '_blank');
            }
        }

        // 绑定事件
        function bindEvents() {
            // 实时搜索
            searchInput.addEventListener('input', (e) => {
                currentKeyword = e.target.value.trim();
                renderCards();
            });
            
            // 回车搜索
            searchInput.addEventListener('keydown', (e) => {
                if (e.key === 'Enter') {
                    baiduSearch(searchInput.value);
                }
            });
            
            // 点击搜索按钮
            searchBtn.addEventListener('click', () => {
                baiduSearch(searchInput.value);
            });
            
            // 标签点击 - 事件委托
            tagsContainer.addEventListener('click', (e) => {
                if (e.target.classList.contains('tag')) {
                    currentCategory = e.target.dataset.category;
                    document.querySelectorAll('.tag').forEach(tag => tag.classList.remove('active'));
                    e.target.classList.add('active');
                    renderCards();
                }
            });
            
            // 卡片点击 - 事件委托
            cardsGrid.addEventListener('click', (e) => {
                const card = e.target.closest('.card');
                if (card) {
                    window.open(card.dataset.url, '_blank');
                }
            });
            
            // 页脚链接点击复制 - 事件委托
            document.addEventListener('click', (e) => {
                if (e.target.classList.contains('footer-link')) {
                    const text = e.target.dataset.copy;
                    copyToClipboard(text);
                }
            });
            
            // 滚动监听 - 显示/隐藏返回顶部按钮
            window.addEventListener('scroll', () => {
                if (window.scrollY > 300) {
                    backToTop.classList.add('show');
                } else {
                    backToTop.classList.remove('show');
                }
            });
            
            // 返回顶部点击
            backToTop.addEventListener('click', () => {
                window.scrollTo({
                    top: 0,
                    behavior: 'smooth'
                });
            });
        }
        
        // 复制到剪贴板
        function copyToClipboard(text) {
            // 创建临时输入框
            const textarea = document.createElement('textarea');
            textarea.value = text;
            textarea.style.position = 'fixed';
            textarea.style.opacity = '0';
            document.body.appendChild(textarea);
            textarea.select();
            
            try {
                document.execCommand('copy');
                showCopyToast();
            } catch (err) {
                // 降级方案
                navigator.clipboard.writeText(text).then(() => {
                    showCopyToast();
                }).catch(() => {
                    console.error('复制失败');
                });
            }
            
            document.body.removeChild(textarea);
        }
        
        // 显示复制提示
        function showCopyToast() {
            copyToast.classList.add('show');
            setTimeout(() => {
                copyToast.classList.remove('show');
            }, 2000);
        }

        // 启动应用
        init();
    </script>
</body>
</html>
