    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        body {
            background: #0f0f0f;
            color: #fff;
            font-family: system-ui, -apple-system, sans-serif;
            min-height: 100vh;
            padding: 2rem 1rem;
        }
        /* 导航搜索区 */
        .header {
            max-width: 1400px;
            margin: 0 auto 3rem;
        }
        .search-bar {
            display: flex;
            gap: 0.8rem;
            margin-bottom: 2rem;
        }
        .search-input {
            flex: 1;
            padding: 0.9rem 1.2rem;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 8px;
            color: #fff;
            font-size: 1rem;
        }
        .search-btn {
            padding: 0 1.5rem;
            background: #2d2d2d;
            border: none;
            border-radius: 8px;
            color: #fff;
            cursor: pointer;
            transition: background 0.2s ease;
        }
        .search-btn:hover {
            background: #3d3d3d;
        }
        /* 分类标签区 */
        .tags {
            display: flex;
            gap: 0.8rem;
            flex-wrap: wrap;
            margin-bottom: 2rem;
        }
        .tag {
            padding: 0.5rem 1.2rem;
            background: #1a1a1a;
            border: 1px solid #2a2a2a;
            border-radius: 20px;
            cursor: pointer;
            transition: all 0.2s ease;
        }
        .tag.active {
            background: #3a3a3a;
            border-color: #4a4a4a;
        }
        /* 卡片网格区 */
        .card-grid {
            max-width: 1400px;
            margin: 0 auto 4rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 1.2rem;
        }
        .card {
            background: #1a1a1a;
            padding: 1.5rem;
            border-radius: 12px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.15);
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: pointer;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .card:hover {
            transform: translateY(-6px) scale(1.03);
            box-shadow: 0 16px 32px rgba(0,0,0,0.3);
        }
        .card a {
            color: #fff;
            text-decoration: none;
            font-size: 1rem;
            display: block;
            width: 100%;
            height: 100%;
        }
        /* 底部区 */
        footer {
            text-align: left;
            color: #666;
            padding: 2rem 4rem; 
            border-top: 1px solid #222;
        }

        footer .p{
            text-align: left;
            color: #666;
            padding: 2rem 4rem; 
            border-top: 1px solid #222;
        }

        /* 响应式适配：大屏一行5卡 */
        @media (min-width: 1200px) {
            .card-grid {
                grid-template-columns: repeat(5, 1fr);
            }
        }
        /* 减少动效适配 */
        @media (prefers-reduced-motion: reduce) {
            * {
                transition-duration: 0.01ms !important;
            }
        }





    </style>
</head>
