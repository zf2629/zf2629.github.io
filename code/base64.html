<script type="text/javascript">
    function base64_encode() {
        var str = CryptoJS.enc.Utf8.parse(jQuery("#content").val());
        var base64 = CryptoJS.enc.Base64.stringify(str);
        hightout(base64);
    }
    function base64_decode() {
        var words = CryptoJS.enc.Base64.parse(jQuery("#content").val());
        hightout(words.toString(CryptoJS.enc.Utf8));
    }
</script>























<script src="./static/js/jquery-3.3.1.min.js"></script>
<script type="text/javascript">
    $("#searchInput").on("input", function() {
        var keyword = $(this).val();
        Public.TableSearch($('#table_minzu'), keyword);
    });
    var Public = {};
    Public.TableSearch = function(table, keyword) {
        if (keyword) {
            keyword = keyword.replace(/\s+/g, '')
        }
        if (!keyword) {
            $('ul', table).each(function() {
                $(this).show()
            });
            $('li', table).each(function() {
                $(this).show()
            });
            return
        }
        var pattern = new RegExp(keyword,'i');
        is_show = false,
        is_td = false,
        str = '';
        $('ul', table).each(function() {
            is_show = false,
            is_td = false;
            $('li', this).each(function() {
                is_td = true;
                str = $(this).text().replace(/\s+/g, '');
                        console.log(str);
                if (pattern.test(str)) {
                    is_show = true
                    $(this).show()
                }else{
                    $(this).hide()
                }
            });
            if (is_td) {
                if (is_show) {
                    $(this).show()
                } else {
                    $(this).hide()
                }
            }
        })
    }
</script>
