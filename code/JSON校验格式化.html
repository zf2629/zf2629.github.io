                <h4>JSON校验格式化</h4>
             
                    <div class="panel panel-defaul">
                        <form id="form1" class="form-horizontal" method="post">
                            <!--div class="input-group mb5"><input class="form-control" type="text" id="txt_url" placeholder="输入远程Json网址" /><span class="input-group-btn"><button class="btn btn-default" type="button" id="get_remote">远程获取Json</button></span> </div-->
                            <div class="form-group">
                                <div class="col-sm-12">
                                    <textarea id="content" name="content" class="form-control" rows="14" placeholder="请输入Json，Json格式化的时候要去除所有转义，转义存在可能导致Json校验不通过"></textarea>
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="col-sm-12 text-center">
                                    <input type="button" class="btn btn-default" onclick="jsonzip(2);" value="Json转义">
                                    <input type="button" class="btn btn-default" onclick="jsonzip(4);" value="去除转义">
                                    <input type="button" class="btn btn-default" onclick="jsonzip(3);" value="压缩并转义">
                                    <input type="button" class="btn btn-info" onclick="jsonzip(1);" value="Json压缩">
                                    <input type="button" class="btn btn-success" name="validate" id="validate" value="Json格式化" />
                                    <input type="button" class="btn btn-default" onclick="JsonToGet(1);" value="转GET参数">
                                    <input type="button" class="btn btn-default" onclick="h2u()" value="中文转Unicode">
                                    <input type="button" class="btn btn-default" onclick="u2h()" value="Unicode转中文">
                                    <span id="copyallcode" class="btn btn-default" data-clipboard-target="#content">复制</span>
                                    <input type="button" class="btn btn-default" onclick="content.value=''" value="清空">
                                </div>
                            </div>
                            <div class="form-group">
                                <div class="col-sm-12">
                                    <div class="alert alert-warning alert-dismissible text-left" role="alert" id="results">
                                        <span>请输入要压缩的Json字符串</span>
                                    </div>
                                </div>
                            </div>
                        </form>
