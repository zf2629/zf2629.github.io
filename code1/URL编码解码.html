
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="utf-8"/>
    <meta name="viewport" content="width=device-width, initial-scale=1.0, minimum-scale=1.0, maximum-scale=1.0, user-scalable=no"/>
    <title>HOMEZF--在线工具</title>
    <meta name="applicable-device" content="pc,mobile"/>
    <meta http-equiv="Cache-Control" content="no-transform"/>
    <meta http-equiv="Cache-Control" content="no-siteapp"/>
    <meta name="keywords" content=""/>
    <meta name="description" content=""/>
    <meta name="renderer" content="webkit"/>
    <meta name="apple-mobile-web-app-capable" content="yes"/>
    <link rel="icon" href="favicon.ico" mce_href="favicon.ico" type="image/x-icon"/>
    <link href=" ./static/style/bootstrap.min.css" rel="stylesheet" type="text/css"/>
    <link href=" ./static/style/tool.css" rel="stylesheet" type="text/css"/>
    <!--[if lt IE 9]>
    <script src="http://apps.bdimg.com/libs/html5shiv/3.7/html5shiv.min.js"></script>
    <script src="http://apps.bdimg.com/libs/respond.js/1.4.2/respond.min.js"></script>
    <![endif]-->
    </head>
<body>
<div class="container">
    <div class="row">
        <div class="col-md-12 col10main">
            <div class="accordion" id="accordion2">
                <div class="accordion-group">
                          <h4>URL编码解码</h4>



							<div class="panel">
								<form id="form1" class="form-horizontal" method="post">
									<div class="form-group">
										<div class="col-sm-12">
											<textarea onmouseover="this.focus();" id="content" name="content" class="form-control" rows="10" placeholder="请输入要转换的文本"></textarea>
										</div>
									</div>
									<div class="form-group">
										<div class="col-sm-12 text-center">
											<button type="button" id="encode" class="btn btn-success">UrlEncode编码</button>
											<button type="button" id="decode" class="btn btn-success">UrlDecode解码</button>
											<span id="copyallcode" class="btn btn-default" data-clipboard-target="#result">复制结果</span>
											<input type="button" onclick="ClearAll();" value="清空" class="btn btn-default">
										</div>
									</div>
									<div class="form-group">
										<div class="col-sm-12">
											<pre><code id="result"></code></pre>
										</div>
									</div>
								</form>
							</div>
						</div>
						<div class="accordion-group">
							<div class="in collapse bs-docs-demoexample">
								<h4>URL编码解码工具</h4>
								<p>URL编码解码工具提供UrlEncode编码,UrlDecode解码,URL网址编码解码,对Url进行编码后可以将一些特殊字符和汉字变为urlEncode编码格式,为了让包含中文的URL可以使用，您可以使用本工具对中文进行UrlEncode编码。</p>
							</div>
						</div>
						<div class="accordion-group"> </div>
					</div>
				</div>
			</div>
		</div>
        <script src="./static/script/jquery-1.11.3.min.js" type="text/javascript"></script>
        <script src="./static/script/bootstrap.min.js" type="text/javascript"></script>
        <script src="./static/script/tool.js" type="text/javascript"></script>
		<script src="./static/script/hightout.js"></script>
		<script type="text/javascript">
			(function () {$("#encode").on('click', function () {hightout(encodeURIComponent($("#content").val()));});$("#decode").on('click', function () {hightout(decodeURIComponent($("#content").val()));});})()
		</script>
</body>
</html>
